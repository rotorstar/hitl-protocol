name: hitl-agent-access-evals
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: hitl
      POSTGRES_PASSWORD: hitl-local
      POSTGRES_DB: hitl
    ports: ['127.0.0.1:5459:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hitl -d hitl']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [hitl-eval-db:/var/lib/postgresql]
  keycloak:
    build: ./keycloak
    image: hitl-keycloak-eval:26.8.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-eval-admin-only
      KC_HOSTNAME: http://localhost:8189
    ports: ['127.0.0.1:8189:8080']
volumes:
  hitl-eval-db:
