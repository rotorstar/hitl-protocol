name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs
      - run: pnpm run audit:dependencies
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm --filter @hitl-protocol/schemas run check:profile
      - run: pnpm --filter @hitl-protocol/schemas run test:pack

  compliance-node:
    name: Compliance Tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter hitl-tests-node run test

  compliance-python:
    name: Compliance Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/python/requirements.txt
      - run: pip install -r tests/python/requirements.txt -r implementations/reference-service/python/requirements.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --strict -r tests/python/requirements.txt -r implementations/reference-service/python/requirements.txt
      - working-directory: tests/python
        run: pytest -v

  agent-access-evals:
    name: Agent Access HTTP, OAuth, Database & Browser Evals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @hitl-protocol/agent-access-reference exec playwright install --with-deps chromium
      - run: docker compose -f implementations/agent-access/compose.yaml up -d --build --wait postgres keycloak
      - name: Wait for the real OAuth provider
        run: node implementations/agent-access/reference/scripts/wait-for-provider.mjs
      - run: pnpm run eval:agent-access
      - run: pnpm run eval:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agent-access-evals
          path: implementations/agent-access/reference/.eval/
          include-hidden-files: true
          if-no-files-found: error
      - name: Stop isolated eval infrastructure
        if: always()
        run: docker compose -f implementations/agent-access/compose.yaml down -v
