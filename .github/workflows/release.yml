name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    # Only the complete CI suite on a trusted main-branch push can unlock publication.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    name: Version & Publish
    permissions:
      contents: write
      pull-requests: write
    env:
      NPM_PUBLISH_CONFIGURED: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require the exact successfully evaluated commit
        env:
          EVALUATED_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EVALUATED_SHA"
          test "$WORKFLOW_SHA" = "$EVALUATED_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Report unconfigured npm publication
        if: env.NPM_PUBLISH_CONFIGURED != 'true'
        run: echo "::notice::NPM_TOKEN is not configured; npm versioning and publication are skipped. GitHub Pages is deployed separately."
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: env.NPM_PUBLISH_CONFIGURED == 'true'
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          publish-script: pnpm run publish:ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
